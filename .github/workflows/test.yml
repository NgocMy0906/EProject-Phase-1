name: CI/CD Microservices

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb-auth:
        image: mongo:5
        ports:
          - 27017:27017
        
      mongodb-product:
        image: mongo:5  
        ports:
          - 27018:27017
        
      mongodb-order:
        image: mongo:5
        ports:
          - 27019:27017
          
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Create environment files
      run: |
        echo "MONGODB_AUTH_URI=mongodb://localhost:27017/auth" > auth/.env
        echo "JWT_SECRET=test_jwt_secret" >> auth/.env
        echo "PORT=3000" >> auth/.env
        
        echo "MONGODB_PRODUCT_URI=mongodb://localhost:27018/products" > product/.env
        echo "JWT_SECRET=test_jwt_secret" >> product/.env
        echo "RABBITMQ_URI=amqp://localhost:5672" >> product/.env
        echo "PORT=3001" >> product/.env
        
        echo "MONGODB_ORDER_URI=mongodb://localhost:27019/orders" > order/.env
        echo "RABBITMQ_URI=amqp://localhost:5672" >> order/.env
        echo "PORT=3002" >> order/.env

    - name: Install dependencies
      run: |
        cd auth && npm ci
        cd ../product && npm ci
        cd ../order && npm ci
        cd ../api-gateway && npm ci

    - name: Run basic health checks
      run: |
        # Start services and test health endpoints
        cd auth && npm start &
        cd product && npm start &
        sleep 10
        curl -f http://localhost:3000/health || echo "Auth health check failed"
        curl -f http://localhost:3001/health || echo "Product health check failed"

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Install docker-compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose-plugin
        
    - name: Build Docker images
      run: |
        docker-compose build