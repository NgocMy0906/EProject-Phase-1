version: '3.8'

services:
  # Database Services
  mongodb-auth:
    image: mongo:5
    container_name: mongodb-auth
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_DATABASE: auth
    volumes:
      - mongodb_auth_data:/data/db
    networks:
      - microservices-network

  mongodb-product:
    image: mongo:5
    container_name: mongodb-product
    ports: ["27018:27017"]
    environment:
      MONGO_INITDB_DATABASE: products
    volumes:
      - mongodb_product_data:/data/db
    networks:
      - microservices-network

  mongodb-order:
    image: mongo:5
    container_name: mongodb-order
    ports: ["27019:27017"]
    environment:
      MONGO_INITDB_DATABASE: orders
    volumes:
      - mongodb_order_data:/data/db
    networks:
      - microservices-network

  # Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 40s
    networks:
      - microservices-network

  # Microservices
  auth:
    build: ./auth
    container_name: auth-service
    ports: ["3000:3000"]
    env_file: ./auth/.env
    depends_on:
      - mongodb-auth
    networks:
      - microservices-network

  product:
    build: ./product
    container_name: product-service
    ports: ["3001:3001"]
    env_file: ./product/.env
    depends_on:
      - mongodb-product
      - rabbitmq
    networks:
      - microservices-network

  order:
    build: ./order
    container_name: order-service
    ports: ["3002:3002"]
    env_file: ./order/.env
    depends_on:
      - mongodb-order
      - rabbitmq
    networks:
      - microservices-network

  # API Gateway - KHÔNG CÓ env_file
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports: ["3003:3003"]
    depends_on:
      - auth
      - product
      - order
    networks:
      - microservices-network

volumes:
  mongodb_auth_data:
  mongodb_product_data:
  mongodb_order_data:
  rabbitmq_data:

networks:
  microservices-network:
    driver: bridge